# douyin-outreach 运行配置（复制为 config.local.yaml 并填写，不要提交）
# SKILL.md / prompts 中的 <占位符> 全部从这里取值

company:
  legal_name: ""          # 工商全称，如「XX 支付科技有限公司」
  brand_name: ""          # 品牌名
  founded: ""             # 成立年份·城市
  website: ""             # 官网域名（仅在对方主动问联系方式时使用）

account:
  douyin_handle: ""       # 执行运营的抖音账号昵称
  dsh_home: ""            # 本机 DSH home 绝对路径，如 D:\dsh-home
  work_dir: ""            # 视频素材/成片工作目录

endorsements:             # 背书轮换池：只填可验证的真实事实，禁止绝对化用语
  - ""                    # 例：外卡业务在跑商户 <真实数量>
  - ""                    # 例：合作渠道方名单
  - ""                    # 例：合作银行名单
  - ""                    # 例：标杆交付案例
  - ""                    # 例：累计服务商户量级

eac:
  project_id: ""          # eac_status 查询到的 projectId（配音任务用）
  voice: "mambo-zh"       # 无 GPT-SoVITS 环境可留空，回退系统 TTS 或不配音

segments:                 # 客群定义（默认面向跨境收款服务商，可自行增删）
  C: "外卡/跨境收款（主攻）"
  B: "分账/多主体（次选）"
  A: "异地/远程收款（备用）"

limits:
  daily_quota: 20         # 平台私信日额度（按自己账号风控实测调低）
  stop_threshold: 18
  quiet_hours: "22:00-07:00"
  max_msg_per_user_24h: 2

compliance:               # 以下红线为固定规则，不建议放开
  forbid: ["具体费率数字", "到账承诺", "审批承诺", "返点承诺", "主动留微信/手机号", "主动发网址", "最/第一/100%/保证"]
