<!DOCTYPE html>
<!-- 视频母版：1080×1920 / 32s @30fps，自包含零外部资源，只用系统字体。
 用法：复制本文件，替换【文案区】与【配色区】，其余结构/动画时间轴不动。
 文案约束：t1 ≤10字×2行；t2 ≤8字；c1/c2/c3 各 ≤26字；outro ≤45字且必须给低门槛动作。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>第 NN 期 · 【文案：本期标题】</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif; }
  /* 【配色区】默认取自 profile.video.color_palette（暖底蓝红黄绿）；换品牌只改这几处 */
  html,body { background:#FFF6E9; }
  #stage { position:relative; width:1080px; height:1920px; }
  .band { position:absolute; left:0; width:1080px; height:8px; }
  #kicker { position:absolute; left:80px; top:150px; font-size:38px; font-weight:700;
    color:#2B2BFF; letter-spacing:2px; }
  #t1 { position:absolute; left:80px; top:250px; width:920px; font-size:104px; line-height:1.16;
    font-weight:900; color:#151433; letter-spacing:-1px; }
  #t2 { position:absolute; left:80px; top:800px; width:920px; font-size:104px; line-height:1.16;
    font-weight:900; color:#FF5A4E; letter-spacing:-1px; }
  .card { position:absolute; left:80px; width:920px; height:250px; border-radius:34px;
    background:#fff; box-shadow:0 18px 44px rgba(21,20,51,.10); padding:44px 48px; }
  #c1 { top:1080px; } #c2 { top:1370px; } #c3 { top:1660px; height:190px; }
  .num { position:absolute; left:48px; top:38px; width:78px; height:78px; border-radius:24px;
    background:#2B2BFF; color:#fff; font-size:44px; font-weight:900;
    display:flex; align-items:center; justify-content:center; }
  .ctext { position:absolute; left:160px; top:44px; width:710px; font-size:44px; line-height:1.42;
    font-weight:700; color:#151433; }
  .ctext em { font-style:normal; color:#FF5A4E; }
  #outro { position:absolute; left:80px; top:1700px; width:920px; font-size:40px;
    line-height:1.5; color:#151433; opacity:0; font-weight:700; }
  #dot { position:absolute; width:150px; height:150px; border-radius:999px; background:#FFC62B;
    left:820px; top:430px; }
  #ring { position:absolute; width:230px; height:230px; border-radius:999px; border:20px solid #2EE6A8;
    left:-60px; top:1250px; opacity:.5; }
  #watermark { position:absolute; left:80px; bottom:52px; font-size:30px; color:#8a86b8;
    letter-spacing:3px; }
</style>
</head>
<body>
<div id="stage">
  <div class="band" id="bandTop" style="top:0;background:#2B2BFF"></div>
  <!-- 【文案区】kicker：栏目名（profile.video.title_prefix + 期号） -->
  <div id="kicker">【栏目名】 · 第 NN 期</div>

  <div id="t1">主标题第一行<br>主标题第二行</div>
  <div id="t2">转折短句（≤8字）</div>

  <div id="dot"></div>
  <div id="ring"></div>

  <div class="card" id="c1"><div class="num">1</div>
    <div class="ctext">要点一：一句人话，<em>关键词</em>用红色强调</div></div>
  <div class="card" id="c2"><div class="num">2</div>
    <div class="ctext">要点二：客户熟悉的<em>具体场景</em></div></div>
  <div class="card" id="c3"><div class="num">3</div>
    <div class="ctext">要点三：<em>数字或事实</em>（必须真实可验证）</div></div>

  <div id="outro">收尾 = 低门槛动作（profile.video.cta），例：私信说下你的情况。</div>
  <div id="watermark">【品牌名】 · 【栏目名】</div>
</div>

<script>
(function () {
  var DURATION = 32;
  window.__meta = { duration: DURATION, width: 1080, height: 1920, fps: 30 };
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
  function easeOutBack(x) { var c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
  function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
  var els = {
    bandTop: document.getElementById('bandTop'), kicker: document.getElementById('kicker'),
    t1: document.getElementById('t1'), t2: document.getElementById('t2'),
    dot: document.getElementById('dot'), ring: document.getElementById('ring'),
    c1: document.getElementById('c1'), c2: document.getElementById('c2'), c3: document.getElementById('c3'),
    outro: document.getElementById('outro')
  };
  function popIn(el, p, dy) {
    var e = easeOutBack(clamp(p, 0, 1));
    el.style.opacity = String(clamp(p * 2.2, 0, 1));
    el.style.transform = 'translateY(' + ((1 - e) * (dy || 40)) + 'px) scale(' + (0.94 + 0.06 * e) + ')';
  }
  window.__seek = function (t) {              // 纯函数：只依赖 t，逐帧截图可任意跳帧
    var p0 = seg(t, 0, 0.6);
    els.bandTop.style.transform = 'scaleX(' + easeOutCubic(p0) + ')';
    els.bandTop.style.transformOrigin = 'left center';
    popIn(els.kicker, seg(t, 0.3, 1.1), 30);
    popIn(els.t1, seg(t, 1.0, 2.2), 60);      // 0-3s 钩子
    popIn(els.t2, seg(t, 3.4, 4.6), 60);
    var pd = seg(t, 3.9, 4.8);
    els.dot.style.opacity = String(clamp(pd * 2, 0, 1));
    els.dot.style.transform = 'scale(' + (0.2 + 0.8 * easeOutBack(pd)) + ')';
    var pr = seg(t, 5.0, 7.2);
    els.ring.style.opacity = String(0.5 * pr);
    els.ring.style.transform = 'rotate(' + (pr * 40) + 'deg)';
    popIn(els.c1, seg(t, 6.5, 7.7), 50);      // 3-25s 三要点
    popIn(els.c2, seg(t, 12.5, 13.7), 50);
    popIn(els.c3, seg(t, 18.5, 19.7), 50);
    var fadeT2 = seg(t, 11.6, 12.6);
    els.t2.style.opacity = String(1 - fadeT2);
    els.t1.style.opacity = String(1 - 0.92 * seg(t, 11.6, 12.6));
    var pOut = easeOutCubic(seg(t, 25.5, 27.0));   // 25-32s 收尾
    var shift = -140 * pOut;
    [els.c1, els.c2, els.c3].forEach(function (c, i) {
      c.style.top = ([1080, 1370, 1660][i] + shift) + 'px';
    });
    var pEnd = seg(t, 26.5, 28.2);
    els.outro.style.opacity = String(clamp(pEnd * 1.8, 0, 1));
    els.outro.style.transform = 'translateY(' + ((1 - easeOutCubic(pEnd)) * 30) + 'px)';
  };
  window.__seek(0);
  window.__ready = true;
})();
</script>
</body>
</html>
